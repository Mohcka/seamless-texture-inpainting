services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - HF_HOME=/app/.cache/huggingface
      - TRANSFORMERS_CACHE_DIR=/app/.cache/huggingface/transformers
      - DIFFUSERS_CACHE=/app/.cache/huggingface/diffusers
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]